name: ✨ Spreadsheet Goblin
run-name: ${{ github.event.head_commit.message || format('Manual deploy ({0})', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.fingerprint.outputs.tag }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile copies only root-level *.go, go.mod, and go.sum.
      - name: Calculate build fingerprint
        id: fingerprint
        shell: bash
        run: |
          HASH=$(git ls-files -z -- Dockerfile .dockerignore go.mod go.sum ':(top,glob)*.go' \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "tag=build-$HASH" >> "$GITHUB_OUTPUT"

      - name: Check image in GHCR
        id: image
        shell: bash
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.fingerprint.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.fingerprint.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release tags without rebuilding
        if: steps.image.outputs.exists == 'true'
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ steps.fingerprint.outputs.tag }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            APP_NAME=botonimsya
            APP_DIR="/u01/$APP_NAME"
            mkdir -p "$APP_DIR"

            cat > "$APP_DIR/.env" << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            cat > "$APP_DIR/credentials.json" << 'EOF'
            ${{ secrets.CREDENTIALS_JSON }}
            EOF

            chmod 644 "$APP_DIR/.env" "$APP_DIR/credentials.json"

            IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

            docker pull "$IMAGE"
            docker rm -f $APP_NAME || true
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              -v "$APP_DIR/credentials.json:/app/credentials.json:ro" \
              "$IMAGE"
            docker image prune -f

